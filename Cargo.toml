[package]
edition      = "2024"
name         = "pocket-computer"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp-test"
path = "./src/bin/main.rs"

[dependencies]
mem-fs = { git = "https://github.com/wesselfr/mem-fs.git", tag = "v0.1.2", default-features = false }
embedded-hal = "1.0.0"
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-storage = { version = "0.8.0", features = ["esp32s3"] }
esp-partition-table = { version = "0.1.3", default-features = false, features = ["embedded-storage", "heapless"] }
embedded-storage = "0.3.1"
critical-section = "1.2.0"
esp-println = { version = "0.16.1", features = ["esp32s3"]}
mipidsi = "0.9.0"
embedded-graphics = "0.8.1"
log = "0.4.29"
heapless = "0.9.2"
embassy-executor = {version = "0.10.0"  }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
esp-rtos = {version = "0.3.0", features = ["esp32s3", "embassy"]}

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 3
overflow-checks  = false
